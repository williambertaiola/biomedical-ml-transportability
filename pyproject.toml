[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-cross-site-transportability"
version = "0.1.0"
description = "Biomedical cross-site transportability experiments from William Bertaiola's Master's thesis"
requires-python = ">=3.10"
authors = [{name = "William Bertaiola"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["F821", "F822", "F823"]
